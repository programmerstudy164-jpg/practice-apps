services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: practice_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: practice_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U practice_user -d practice_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    image: practice-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: practice_user
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: practice_db
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
